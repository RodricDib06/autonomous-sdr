[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
env =
    TESTING=1
    # Unit tests run on in-memory SQLite (tests/conftest.py); the app only
    # needs *a* URL to import. D: = default, so CI's real Postgres URL wins.
    D:DATABASE_URL=sqlite://
    EMAIL_VERIFICATION_ENABLED=false
    SENDER_AUTH_CHECK_ENABLED=false
markers =
    unit: Unit tests (no external services)
    integration: Integration tests (requires external services)
    slow: Slow tests
