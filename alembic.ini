# Alembic configuration file
# Usage:
#   alembic upgrade head      — apply all pending migrations
#   alembic downgrade -1      — roll back one migration
#   alembic revision --autogenerate -m "describe change"  — generate new migration
#   alembic history           — show migration history
#   alembic stamp head        — mark existing DB as up-to-date (use on first deploy)
#
# DATABASE_URL is set dynamically in alembic/env.py from app.config.settings.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url is intentionally left blank — set in env.py from settings
sqlalchemy.url =

[post_write_hooks]
# Uncomment to auto-format generated migrations with ruff:
# hooks = ruff
# ruff.type = exec
# ruff.entrypoint = ruff
# ruff.options = --fix AUTOGEN_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
