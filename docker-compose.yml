## AutonomousSDR — full-stack compose
##
## Quick start (zero paid APIs):
##   docker compose up --build
##   → API:      http://localhost:8000
##   → Docs:     http://localhost:8000/docs
##   → Frontend: http://localhost:5173
##
## With Ollama (local AI):
##   docker compose --profile ollama up --build
##   docker compose exec ollama ollama pull mistral
##
## Default login: admin@autonomoussdr.com / changeme123

services:

  # ── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sdr_user
      POSTGRES_PASSWORD: sdrpassword
      POSTGRES_DB: sdr_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sdr_user"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Ollama (local AI — optional) ──────────────────────────────────────────
  # Start with: docker compose --profile ollama up
  # First run:  docker compose exec ollama ollama pull mistral
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  # ── Migrations + demo data seeder (runs once then exits) ──────────────────
  migrate:
    build: .
    command: bash scripts/docker_migrate.sh
    env_file:
      - path: .env
        required: false        # optional — env vars below are enough for demo
    environment:
      DATABASE_URL: postgresql://sdr_user:sdrpassword@postgres:5432/sdr_db
      REDIS_URL: redis://redis:6379
      OLLAMA_BASE_URL: http://ollama:11434
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      ENRICHMENT_PROVIDER: ${ENRICHMENT_PROVIDER:-synthetic}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@autonomoussdr.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-changeme123}
      SECRET_KEY: ${SECRET_KEY:-demo-secret-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  # ── API server ────────────────────────────────────────────────────────────
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://sdr_user:sdrpassword@postgres:5432/sdr_db
      REDIS_URL: redis://redis:6379
      OLLAMA_BASE_URL: http://ollama:11434
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      ENRICHMENT_PROVIDER: ${ENRICHMENT_PROVIDER:-synthetic}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@autonomoussdr.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-changeme123}
      SECRET_KEY: ${SECRET_KEY:-demo-secret-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── LangGraph worker ──────────────────────────────────────────────────────
  worker:
    build: .
    command: python -m app.worker.lead_worker
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://sdr_user:sdrpassword@postgres:5432/sdr_db
      REDIS_URL: redis://redis:6379
      OLLAMA_BASE_URL: http://ollama:11434
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      ENRICHMENT_PROVIDER: ${ENRICHMENT_PROVIDER:-synthetic}
      SECRET_KEY: ${SECRET_KEY:-demo-secret-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── React frontend (nginx) ────────────────────────────────────────────────
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
